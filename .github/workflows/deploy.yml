name: Deploy to GitHub Pages + Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # ── Deploy Firestore rules + indexes to Firebase ───────────────────────
      # Requires one secret in GitHub → Settings → Secrets → Actions:
      #   FIREBASE_SERVICE_ACCOUNT  — paste the full JSON of a Firebase service account key
      #   (Firebase Console → Project Settings → Service Accounts → Generate new private key)
      - name: Deploy Firestore rules + indexes
        # FIREBASE_SERVICE_ACCOUNT secret must be set in GitHub → Settings → Secrets → Actions
        # Value = full JSON of a Firebase service account private key.
        # continue-on-error: true so a Firestore auth issue never blocks the Pages deploy.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "⚠️  FIREBASE_SERVICE_ACCOUNT secret not set — skipping Firestore deploy"
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          STATUS=$?
          rm -f /tmp/sa.json
          exit $STATUS
